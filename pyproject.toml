[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-markov"
version = "1.0.0"
description = "Streaming, disk-backed Turkish word and character Markov generator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Turkish Markov contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/beratbesli/turkish-markov"
Issues = "https://github.com/beratbesli/turkish-markov/issues"

[project.scripts]
turkish-markov = "turkish_markov.cli:main"
turkish-markov-gui = "turkish_markov.webgui:main"

[tool.setuptools.packages.find]
include = ["turkish_markov*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
